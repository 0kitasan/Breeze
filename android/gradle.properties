org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# AGP 9 默认禁止 getDefaultProguardFile('proguard-android.txt')，而
# flutter_inappwebview_android 1.1.3 仍在用（上游 issue #2852，6.2.0-beta 已修
# 但未发稳定版）。这是 AGP 官方提供的临时逃生口（AGP 10 会移除），
# 等 flutter_inappwebview 升级到 6.2.0 稳定版后删掉本行。
# 注意：插件是 library 模块，buildType 里的 proguardFiles 不参与 App 的 R8 配置，
# 因此本开关对最终产物没有任何行为影响。
android.r8.proguardAndroidTxt.disallowed=false
# pub 缓存（C:\Users\windy\.puro\shared\pub_cache）与工程（D:）不在同一个盘，
# Kotlin 可重定位增量缓存算不出跨盘相对路径，插件模块编译会报
# "Could not close incremental caches ... different roots"（flutter#173456）。
# 关掉 Kotlin 增量编译规避；本工程 Kotlin 源码只有 MainActivity 一个文件，
# 插件 Kotlin 源也很少，代价可忽。若将来把 PUB_CACHE 换到 D: 可删掉本行。
kotlin.incremental=false
