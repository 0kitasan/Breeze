name: Breeze Android Debug Build

on:
  push:
    branches:
      - build/android-debug
  workflow_dispatch:
    inputs:
      source_ref:
        description: "待测试的分支或提交；留空构建当前分支，例如 fix/zoomed-reader-scroll"
        required: false
        type: string

permissions:
  contents: read

env:
  BREEZE_PLUGIN_GITHUB_TOKEN: ${{ github.token }}

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_ref || github.ref }}

      # - name: 克隆 rquickjs_playground
      #   run: git clone https://github.com/deretame/rquickjs_playground.git

      - name: 释放空间 (free-disk-space)
        uses: jlumbroso/free-disk-space@main
        with:
          android: true
          dotnet: true
          haskell: false
          large-packages: false
          docker-images: true
          preinstalled-runtimes: true
          swap-storage: false

      - name: 重建 Android SDK 目录
        run: |
          sudo mkdir -p /usr/local/lib/android/sdk
          sudo chown -R $USER:$USER /usr/local/lib/android

      - name: 安装编译依赖 (LLVM/Clang)
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-dev libclang-dev clang

      # 仅在 runner 中移除加密配置，Debug 使用 Android 默认调试签名。
      - name: 准备 Debug 签名
        run: rm -f android/key.properties android/Breeze-key.keystore

      - name: 设置 Java 21 & SDK
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v4

      - name: 设置 Dart SDK
        uses: dart-lang/setup-dart@v1

      - name: 设置 Flutter (FVM)
        run: |
          dart pub global activate fvm
          echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH
          export PATH="$PATH:$HOME/.pub-cache/bin"
          fvm install && fvm use --force
          echo "$GITHUB_WORKSPACE/.fvm/flutter_sdk/bin" >> $GITHUB_PATH

      - name: 安装 Rust (Android 目标)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: 缓存 Rust 构建产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust

      - name: 读取 NDK 版本配置
        id: ndk-config
        run: |
          NDK_VER=$(grep "ndkVersion" android/app/build.gradle.kts | awk -F'"' '{print $2}')
          echo "ndk_version=$NDK_VER" >> $GITHUB_OUTPUT

      - name: 缓存 Android NDK
        uses: actions/cache@v5
        with:
          path: /usr/local/lib/android/sdk/ndk/${{ steps.ndk-config.outputs.ndk_version }}
          key: ${{ runner.os }}-android-ndk-${{ steps.ndk-config.outputs.ndk_version }}

      - name: 安装 Android NDK
        run: sdkmanager "ndk;${{ steps.ndk-config.outputs.ndk_version }}" "platforms;android-36" "cmake;3.22.1"

      - name: 设置 NDK 环境变量
        run: |
          NDK_VER=${{ steps.ndk-config.outputs.ndk_version }}
          ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}
          NDK_PATH="$ANDROID_HOME/ndk/$NDK_VER"
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> $GITHUB_ENV
          echo "$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: 接受 Android Licenses
        run: yes | fvm flutter doctor --android-licenses || true

      - name: 拉取 Flutter 依赖
        run: fvm flutter pub get

      - name: 缓存 Android waifu2x CLI 依赖
        uses: actions/cache@v5
        with:
          path: third_party/android_ncnn_deps
          key: ${{ runner.os }}-android-waifu2x-deps-${{ hashFiles('script/android/prepare_android_waifu2x_deps.py', 'script/android/build_ncnn_static_android.py', 'script/android/build_waifu2x_cli_android.py', 'android/app/src/main/cpp/waifu2x_cli/CMakeLists.txt') }}

      - name: 缓存 ncnn 源码
        uses: actions/cache@v5
        with:
          path: third_party/ncnn-src
          key: ${{ runner.os }}-android-ncnn-src-${{ hashFiles('script/android/build_ncnn_static_android.py') }}

      - name: 缓存 RealSR-NCNN-Android 源码
        uses: actions/cache@v5
        with:
          path: third_party/RealSR-NCNN-Android
          key: ${{ runner.os }}-android-realsr-src-${{ hashFiles('script/android/build_waifu2x_cli_android.py') }}

      - name: 准备 Android waifu2x CLI 依赖
        run: |
          python3 script/android/prepare_android_waifu2x_deps.py

      - name: 编译 Android 静态 ncnn
        run: |
          python3 script/android/build_ncnn_static_android.py

      - name: 编译 Android waifu2x CLI
        run: |
          python3 script/android/build_waifu2x_cli_android.py

      - name: 构建 Android ARM64 Debug APK
        run: fvm flutter build apk --debug --target-platform=android-arm64

      - name: 上传 Android 产物
        uses: actions/upload-artifact@v6
        with:
          name: breeze-android-arm64-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
